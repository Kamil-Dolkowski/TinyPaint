<!DOCTYPE html>
<head>
    <title>Tiny Paint</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <!-- fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"> -->

    <!-- css -->
    <link rel="stylesheet" href="css/ui.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/slider.css">
    <link rel="stylesheet" href="css/color_palette.css">
    <link rel="stylesheet" href="css/layers.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Toolbar -->
    <header id="toolbar">
        <section id="toolbar-global">
            <button id="settings-btn" class="toolbar-button"><i class="fa-solid fa-gear"></i></button>

            <button disabled id="undo-btn" title="Cofnij" class="toolbar-button"><i class="fa-solid fa-arrow-rotate-left"></i></button>
            <button disabled id="redo-btn" title="Ponów" class="toolbar-button"><i class="fa-solid fa-arrow-rotate-right"></i></button>

            <!-- <button disabled id="bgcolor-btn" title="Kolor tła" class="toolbar-button"><i class="fa-solid fa-image"></i></button> -->
            <button id="clear-btn" title="Wyczyść" class="toolbar-button"><i class="fa-solid fa-trash"></i></button>
            <button id="reset-zoom-btn" title="Reset widoku" class="toolbar-button"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></button>

            <button id="export-btn" title="Pobierz" class="toolbar-button"><i class="fa-solid fa-file-arrow-up"></i></button>
            <button id="import-btn" title="Załaduj" class="toolbar-button"><i class="fa-solid fa-file-arrow-down"></i></button>

            <!-- <a href="https://github.com/Kamil-Dolkowski/TinyPaint" title="GitHub" class="toolbar-button" style="text-decoration: none;"><i class="fa-brands fa-github"></i></a> -->
            <button id="layers-btn" title="Warstwy" class="toolbar-button"><i class="fa-solid fa-layer-group"></i></button>
        </section>
        <section id="toolbar-tools">
            <button id="pencil-btn" title="Ołówek" class="toolbar-button" data-state="on"><i class="fa-solid fa-pencil"></i></i></button>
            <button id="brush-btn" title="Pędzel" class="toolbar-button" data-state="off"><i class="fa-solid fa-brush"></i></button>
            <button id="line-btn" title="Linia" class="toolbar-button" data-state="off"><i class="fa-solid fa-slash"></i></button>
            <button id="eraser-btn" title="Gumka" class="toolbar-button" data-state="off"><i class="fa-solid fa-eraser"></i></button>
            <button id="move-zoom-btn" title="Przesuń, Przybliż/Oddal" class="toolbar-button" data-state="off"><i class="fa-solid fa-arrows-up-down-left-right"></i></button>
            <button id="eyedropper-btn" title="Wybierz kolor" class="toolbar-button" data-state="off"><i class="fa-solid fa-eye-dropper"></i></button>
            
            <button id="fill-btn" title="Wypełnij" class="toolbar-button" data-state="off"><i class="fa-solid fa-fill-drip"></i></button>
            <button id="select-btn" title="Zaznacz" class="toolbar-button" data-state="off"><i class="fa-solid fa-object-group"></i></button>
            <button id="shapes-btn" title="Kształty" class="toolbar-button" data-state="off"><i class="fa-solid fa-shapes"></i></button>
            <button id="text-btn" title="Tekst" class="toolbar-button" data-state="off"><i class="fa-solid fa-t"></i></button>
        </section>
    </header>

     <!-- Workspace -->
    <div id="workspace">
        <canvas id="cursor-canvas"></canvas>
        <canvas id="canvas"></canvas>
        <canvas id="checkerboard"></canvas>
        <!-- <canvas id="bg-canvas"></canvas> -->

         <!-- Layers -->
        <!-- <div id="layers-window" class="window">
            <div id="layers-list">
                <div class="layer-element">
                    <button class="toolbar-button"><i class="fa-solid fa-grip-lines"></i></button>

                    <div class="layer-name">Warstwa 1</div>

                    <button class="toolbar-button"><i class="fa-solid fa-trash"></i></button>
                </div>

                <div class="layer-element">

                </div>
            </div>

            <button class="button-small"><i class="fa-solid fa-plus"></i>Dodaj warstwę</button>
        </div> -->
        
    </div>

    <!-- Palette -->
    <div id="palette-window" class="window">
        <div id="palette-options">
            <button id="color-palette-btn" class="button-small"><!--<i class="fa-solid fa-palette"></i>-->Paleta kolorów</button>
            <button id="color-picker-btn" class="button-small"><!--<i class="fa-solid fa-eye-dropper"></i>-->Wybierz kolor</button>
        </div>
        <div id="palette-content">
            <div id="color-palette">
                <div id="color-palette-content"></div>
                <button id="delete-color-btn" class="button-small"><i class="fa-solid fa-trash" style="margin: 2px 10px 2px 0px;"></i>Usuń kolor</button>
            </div>
            <div id="color-picker" style="display: none;"></div>
        </div>
    </div>

   

    <!-- Settings -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">

            <div class="modal-header">
                <span class="modal-close">&times;</span>
                <h2>Ustawienia</h2>
            </div>
            
            <div class="modal-body">
                <ul>
                    <li id="canvas-size-settings">
                        <h3>Rozmiar płótna</h3>

                        <div id="canvas-size-inputs">
                            <label>
                                Szerokość [px]
                                <input type="number" id="canvas-size-width-input" min="1" value="800">
                            </label>
                            <p>x</p>
                            <label>
                                Wysokość [px]
                                <input type="number" id="canvas-size-height-input" min="1" value="600">
                            </label>
                        </div>
                    </li>
                    <li class="hidden">
                        <h3>Kolor tła</h3>

                        <input type="color" id="background-input">
                    </li>
                </ul>
            </div>

            <div class="modal-footer">
                <button id="settings-save" class="button-small">Zapisz zmiany</button>
            </div>
        </div>
    </div>

    <!-- Contextual Toolbar -->
    <footer id="contextual-toolbar">
        <button id="palette-btn" title="Paleta" class="toolbar-button"><i class="fa-solid fa-palette"></i></button>
        <div id="current-color-group">
            <div id="current-color-checkerboard" class="toolbar-button"></div>
            <button id="current-color" class="toolbar-button"></button>
        </div>

        <div style="margin:20px;"></div>
        <div style="margin:20px;"></div>

        <span class="toolbar-button"><i class="fa-solid fa-pen-nib"></i></span>
        <button id="decrease-btn" class="toolbar-button"><i class="fa-solid fa-minus"></i></button>
        <input type="range" min="1" max="40" value="1">
        <button id="increase-btn" class="toolbar-button"><i class="fa-solid fa-plus"></i></button>
        <div id="size-lbl" class="size-lbl toolbar-button">5</div>

        <div style="margin:20px;"></div>

        <span class="toolbar-button"><i class="fa-solid fa-a"></i></span>
        <button id="alpha-decrease-btn" class="toolbar-button"><i class="fa-solid fa-minus"></i></button>
        <input type="range" min="0" max="100" value="100">
        <button id="alpha-increase-btn" class="toolbar-button"><i class="fa-solid fa-plus"></i></button>
        <div id="alpha-lbl" class="size-lbl toolbar-button">100</div>
    </footer>

    <script type="module" src="js/main.js"></script>
    <script src="js/settings.js"></script>
</body>
